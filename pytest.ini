[pytest]
# Test discovery
norecursedirs = scripts .git .local_backups .model_backups .pytest_cache
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ---------------------------------------------------------------------------
# THE TEST TAXONOMY. Tiers are applied automatically in tests/conftest.py by
# filename — NOT by hand, because the previous eight markers were declared here
# and used by exactly zero tests.
#
# Each tier answers a different question and fails for a different reason:
#
#   pytest -m unit          Is the CODE correct?        fast, offline, no data
#   pytest -m environment   Is the RUNTIME set up?      artifacts exist & cohere
#   pytest -m data          Did the data LOAD right?    no garbage, no gaps
#   pytest -m pipeline      Do the PIECES work?         stages + orchestrator
#   pytest -m perf          Is it FAST ENOUGH?          latency vs baseline
#   pytest -m accuracy      Is it GOOD ENOUGH?          quality vs baseline
#
# The inner loop is `pytest -m unit` (no data needed). The merge gate (#784)
# stands on `pytest -m "perf or accuracy"`.
# ---------------------------------------------------------------------------
markers =
    unit: code correctness — fast, offline, no data required
    contract: the orchestrator holds every stage to the contract — the PRIMARY suite, runs on a tiny in-memory store (no production indexes)
    environment: the runtime is set up — artifacts exist, cohere, and are usable
    data: the data loaded/prepared correctly and is free of garbage
    pipeline: the pipeline and its stages work end to end
    perf: latency regression against a recorded baseline
    accuracy: quality regression against a recorded baseline
    slow: deselect with -m "not slow"

# Output options
console_output_style = progress
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
